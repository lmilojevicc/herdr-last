name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds stay uncached on purpose.
          cache: false

      - name: Check installer
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install_test.sh
          bash scripts/install_test.sh

      - name: Validate versions
        shell: bash
        run: |
          manifest_version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' herdr-plugin.toml)"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"
          test "$(go run . version)" = "herdr-last v${manifest_version}"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release assets
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/herdr-last-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/herdr-last-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/herdr-last-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/herdr-last-linux-arm64 .
          test "$(dist/herdr-last-linux-amd64 version)" = "herdr-last ${GITHUB_REF_NAME}"
          (cd dist && sha256sum herdr-last-* > SHA256SUMS)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
